<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Perfumes</title>
  <style>
    header {
      background-color: #E6D3F8; /* tom suave lilás */
      color: #2C2C2C;
      text-align: center;
      max-height: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    main {
      background-color: #2C2C2C; /* fundo escuro elegante */
      color: #E6D3F8;
      max-height: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    img {
      width: 120px;
      height: 120px;
      margin: 10px;
      border-radius: 8px;
    }
    .produtos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    .produto {
      margin: 16px;
      text-align: center;
    }
    footer {
      background-color: #E6D3F8;
      color: #2C2C2C;
      text-align: center;
      padding: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Perfume & Elegância</h1>
    <h3>Fragrâncias exclusivas para todos os estilos ✨🌸🌹</h3>
  </header>
  <main>
    <h2>Nossos Perfumes</h2>
    <div class="produtos">
      <div class="produto">
        <img src="perfume1.png" alt="Perfume Floral">
        <p>Perfume Floral - R$ 199,90</p>
      </div>
      <div class="produto">
        <img src="perfume2.png" alt="Perfume Amadeirado">
        <p>Perfume Amadeirado - R$ 249,90</p>
      </div>
      <div class="produto">
        <img src="perfume3.png" alt="Perfume Oriental">
        <p>Perfume Oriental - R$ 229,90</p>
      </div>
    </div>
  </main>
  <footer>
    <p>© 2026 Perfume & Elegância - Todos os direitos reservados</p>
    <p>Contato: contato@perfume-elegancia.com | Tel: (43) 3333-4444</p>
  </footer>
</body>
</html>
